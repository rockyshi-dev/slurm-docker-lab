# Four "GPUs" per node for --gres=gpu:N scheduling. No real GPU is ever mapped into a container. Slurm 23.11's gres/gpu
# plugin drops a GPU line without File= ("Ignoring file-less GPU"), even with Flags=CountOnly, so the four entries name
# four harmless pseudo devices that exist in every container. With TaskPlugin=task/none nothing is bound to them; the
# only effect in a job step is CUDA_VISIBLE_DEVICES=0,1,2,3.
NodeName=c[1-4] Name=gpu File=/dev/null,/dev/zero,/dev/full,/dev/random
