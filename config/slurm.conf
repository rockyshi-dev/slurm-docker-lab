# Virtual 4-node cluster in Docker. Nodes c1-c4, each declared with 4 CPUs, 4000 MB and 4 GPUs by count only.
ClusterName=lab
SlurmctldHost=slurmctld
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
CredType=cred/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info
# containers: no cgroups, no affinity; the configured CPU/memory counts win over what the container reports
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
MpiDefault=none
SlurmdParameters=config_overrides
# fault drill: a node whose slurmd stops answering is DOWN after 30 s and comes back by itself when slurmd returns
SlurmdTimeout=30
SlurmctldTimeout=60
ReturnToService=2
JobRequeue=1
KillWait=10
MinJobAge=300
InactiveLimit=0
Waittime=0
MailProg=/bin/true
# scheduling
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
# memory a job reserves per CPU when it does not ask (without this a job reserves its whole node, and a second job on
# the node waits for memory, not for GPUs)
DefMemPerCPU=1000
GresTypes=gpu
# priorities (multifactor so sprio shows the parts; fairshare needs the accounting below)
PriorityType=priority/multifactor
PriorityDecayHalfLife=1-0
PriorityWeightAge=1000
PriorityWeightFairshare=10000
PriorityWeightJobSize=1000
PriorityWeightPartition=1000
PriorityWeightQOS=1000
PriorityMaxAge=1-0
# preemption between partitions (exercise 4): a job in `high` requeues a job in `low`
PreemptType=preempt/partition_prio
PreemptMode=REQUEUE
# accounting
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30
# nodes and partitions
NodeName=c[1-4] CPUs=4 RealMemory=4000 Gres=gpu:4 State=UNKNOWN
PartitionName=main Nodes=c[1-4] Default=YES MaxTime=02:00:00 DefaultTime=00:10:00 State=UP PriorityTier=1
PartitionName=low  Nodes=c[1-4] MaxTime=02:00:00 DefaultTime=00:10:00 State=UP PriorityTier=1 PreemptMode=REQUEUE
PartitionName=high Nodes=c[1-4] MaxTime=02:00:00 DefaultTime=00:10:00 State=UP PriorityTier=2 PreemptMode=OFF
