# Virtual Slurm cluster: slurmctld, slurmdbd + MariaDB, four slurmd nodes c1-c4. CPU only; no GPU is mapped in.
# The shared job directory and the daemon logs live under ./data; MariaDB keeps its tables in a named volume.
x-slurm: &slurm
  image: slurm-lab:local
  build: .
  volumes:
    - ./config:/etc/slurm-lab:ro
    - ./exercises:/home/lab/exercises:ro
    - ./data/shared:/shared
  networks: [slurm]
  restart: "no"

services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    hostname: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootlab
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD: slurmlab
    volumes:
      - mariadb:/var/lib/mysql
    networks: [slurm]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  slurmdbd:
    <<: *slurm
    container_name: slurmdbd
    hostname: slurmdbd
    environment: { ROLE: slurmdbd }
    volumes:
      - ./config:/etc/slurm-lab:ro
      - ./data/log/slurmdbd:/var/log/slurm
    depends_on:
      mariadb: { condition: service_healthy }
  slurmctld:
    <<: *slurm
    container_name: slurmctld
    hostname: slurmctld
    environment: { ROLE: slurmctld }
    volumes:
      - ./config:/etc/slurm-lab:ro
      - ./exercises:/home/lab/exercises:ro
      - ./data/shared:/shared
      - ./data/log/slurmctld:/var/log/slurm
      - ./data/state:/var/spool/slurmctld
    depends_on: [slurmdbd]
  c1:
    <<: *slurm
    container_name: c1
    hostname: c1
    environment: { ROLE: slurmd }
    cpus: 4
    volumes:
      - ./config:/etc/slurm-lab:ro
      - ./exercises:/home/lab/exercises:ro
      - ./data/shared:/shared
      - ./data/log/c1:/var/log/slurm
    depends_on: [slurmctld]
  c2:
    <<: *slurm
    container_name: c2
    hostname: c2
    environment: { ROLE: slurmd }
    cpus: 4
    volumes:
      - ./config:/etc/slurm-lab:ro
      - ./exercises:/home/lab/exercises:ro
      - ./data/shared:/shared
      - ./data/log/c2:/var/log/slurm
    depends_on: [slurmctld]
  c3:
    <<: *slurm
    container_name: c3
    hostname: c3
    environment: { ROLE: slurmd }
    cpus: 4
    volumes:
      - ./config:/etc/slurm-lab:ro
      - ./exercises:/home/lab/exercises:ro
      - ./data/shared:/shared
      - ./data/log/c3:/var/log/slurm
    depends_on: [slurmctld]
  c4:
    <<: *slurm
    container_name: c4
    hostname: c4
    environment: { ROLE: slurmd }
    cpus: 4
    volumes:
      - ./config:/etc/slurm-lab:ro
      - ./exercises:/home/lab/exercises:ro
      - ./data/shared:/shared
      - ./data/log/c4:/var/log/slurm
    depends_on: [slurmctld]

volumes:
  mariadb: {}

networks:
  slurm: {}
